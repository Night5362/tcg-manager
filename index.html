<style>
:root{--bg:#F1EBDD;--card:#FBF8F0;--tx:#0A1428;--mu:#5F5B52;--bd:#D2C39A;--ac:#8C6A2F;--acx:#FFFFFF;--bl:#005A82;--in:#FFFFFF;--gold1:#E6CF98;--gold2:#C8AA6E;--gold3:#A9873F;--w:#1E8E5A;--l:#C8323F;--d:#B7791F;--sh:0 6px 18px rgba(10,20,40,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#010A13;--card:#0A1428;--tx:#F0E6D2;--mu:#A09B8C;--bd:#4A3C1F;--ac:#C8AA6E;--acx:#010A13;--bl:#0AC8B9;--in:#010A13;--w:#2FBF8A;--l:#E84057;--d:#E0A030;--sh:0 8px 22px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#010A13;--card:#0A1428;--tx:#F0E6D2;--mu:#A09B8C;--bd:#4A3C1F;--ac:#C8AA6E;--acx:#010A13;--bl:#0AC8B9;--in:#010A13;--w:#2FBF8A;--l:#E84057;--d:#E0A030;--sh:0 8px 22px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:radial-gradient(900px 380px at 50% -140px,rgba(10,200,185,.16),transparent 70%),radial-gradient(700px 300px at 100% 0,rgba(200,170,110,.12),transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:70px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 14px;letter-spacing:.08em;color:var(--ac);padding-bottom:8px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--ac),transparent 75%) 1;text-shadow:0 1px 8px rgba(200,170,110,.25)}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--sh),inset 0 1px 0 rgba(240,230,210,.07)}
.card::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:.75;pointer-events:none}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;letter-spacing:.04em}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(200,170,110,.22)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit;cursor:pointer;transition:filter .15s}
.seg button.on{background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));border-color:var(--gold3);color:#010A13;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 8px rgba(200,170,110,.25)}
.seg button.on.w,.seg button.on.l,.seg button.on.d{color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.45);border-color:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.25),0 3px 10px rgba(0,0,0,.35)}
.btn{width:100%;margin-top:14px;padding:12px;border:1px solid var(--gold3);border-radius:8px;background:linear-gradient(180deg,var(--gold1),var(--gold2) 55%,var(--gold3));color:#010A13;font:700 16px inherit;letter-spacing:.12em;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px rgba(200,170,110,.28)}
.btn:active{filter:brightness(.94)}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);margin-top:8px;font-weight:500;font-size:14px;letter-spacing:.04em;box-shadow:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:linear-gradient(180deg,var(--card),var(--bg));border-top:1px solid var(--bd);box-shadow:0 -6px 18px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 0;border:0;background:none;color:var(--mu);font:inherit;cursor:pointer;letter-spacing:.04em}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 2px 0 var(--ac);background:linear-gradient(180deg,rgba(200,170,110,.14),transparent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{display:inline-block;min-width:34px;text-align:center;padding:2px 8px;border-radius:6px;color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;text-shadow:0 1px 2px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.35)}
.b-w,.seg button.on.w{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%,rgba(0,0,0,.14)),var(--w)}
.b-l,.seg button.on.l{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%,rgba(0,0,0,.14)),var(--l)}
.b-d,.seg button.on.d{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%,rgba(0,0,0,.14)),var(--d)}
.mu{color:var(--mu);font-size:12px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.big b{display:block;font-size:24px}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--w))}
.x{border:0;background:none;color:var(--l);cursor:pointer;font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.empty{text-align:center;color:var(--mu);padding:30px 0}
</style>
</head>

var RBZ={"Ahri": "九尾妖狐 阿璃", "Akali": "隻影刺客 阿卡莉", "Ambessa": "鐵血狼母 安比薩", "Annie": "黑暗之女 安妮", "Azir": "蘇瑞瑪砂皇 阿祈爾", "Darius": "諾克薩斯之力 達瑞斯", "Diana": "輕藐之月 黛安娜", "Draven": "處刑娛樂大師 達瑞文", "Ekko": "時空少年 艾克", "Evelynn": "臨終擁抱 伊芙琳", "Ezreal": "探險家 伊澤瑞爾", "Fiora": "孤高劍客 菲歐拉", "Garen": "蒂瑪西亞之力 蓋倫", "Irelia": "舞劍靈使 伊瑞莉雅", "Ivern": "綠林之父 埃爾文", "Jarvan IV": "蒂瑪西亞楷模 嘉文四世", "Jax": "武器達人 賈克斯", "Jayce": "明日守護者 杰西", "Jhin": "炫技大師 燼", "Jinx": "暴走重砲 吉茵珂絲", "Kai'Sa": "虛空之女 凱莎", "Kennen": "狂暴之心 凱能", "Kha'Zix": "虛空掠食者 卡力斯", "K'Sante": "納祖瑪之傲 卡桑帝", "LeBlanc": "詐欺師 勒布朗", "Lee Sin": "盲眼武僧 李星", "Leona": "黎明之光 雷歐娜", "Lillia": "羞赧綻華 莉莉亞", "Lucian": "驅魔聖槍 路西恩", "Lux": "光之少女 拉克絲", "Master Yi": "無極劍聖 易大師", "Mel": "映魂密使 梅爾", "Miss Fortune": "賞金獵人 好運姐", "Mordekaiser": "金屬亡靈 魔鬥凱撒", "Nasus": "沙漠死神 納瑟斯", "Orianna": "發條少女 奧莉安娜", "Ornn": "爐心山神 鄂爾", "Poppy": "聖鎚守護者 波比", "Pyke": "血港開膛手 派克", "Rek'Sai": "虛空穿梭者 雷珂煞", "Renata Glasc": "化學女爵 睿娜妲．格萊斯克", "Renekton": "沙漠屠夫 雷尼克頓", "Rengar": "傲慢伏擊者 雷葛爾", "Riven": "破刃放逐者 雷玟", "Rumble": "武裝機兵 藍寶", "Sett": "獸血拳皇 賽特", "Seraphine": "燦眸歌姬 瑟菈紛", "Shen": "暮光之眼 慎", "Sivir": "戰爭女神 希維爾", "Teemo": "迅捷斥候 提摩", "Vex": "愁霧影巫 薇可絲", "Vi": "鐵腕特警 菲艾", "Viktor": "奧術預示者 維克特", "Volibear": "無情風暴 弗力貝爾", "Yasuo": "放逐浪人 犽宿", "Zed": "影忍至尊 劫", "Ziggs": "魔法爆破專家 希格斯"};
function migRB(){var ch=0,nm={};recs.forEach(function(r){if(r.game!=='符文戰場')return;if(RBZ[r.me]){nm[r.me]=1;r.me=RBZ[r.me];ch=1}if(RBZ[r.opp]){r.opp=RBZ[r.opp];ch=1}});Object.keys(nm).forEach(function(k){if(DM[k]&&!DM[RBZ[k]]){DM[RBZ[k]]=DM[k];delete DM[k]}});if(ch){save();sd()}return ch}
function dnH(k,c){k=String(k);var i=k.indexOf('（');if(i<=0||k.slice(-1)!=='）')return esc(k);return esc(k.slice(0,i))+' <span style="font-size:10px;font-weight:400;color:'+(c||'var(--mu)')+'">'+esc(k.slice(i+1,-1))+'</span>'}
function evChip(){if(!flt.ek)return '';var e=evList().filter(function(x){return x.k===flt.ek})[0];return '<div class="row" style="margin-top:8px;align-items:center"><span class="mu">賽事篩選：'+(e?esc(e.n):'')+'</span><button class="x" style="flex:none" onclick="flt={q:\'\',from:\'\',to:\'\',deck:\'\',ek:\'\'};render()">清除</button></div>'}
function goEv(i){var e=evList()[i];if(!e)return;var d=e.rs[0].me;flt={q:'',from:e.a,to:e.b,deck:e.rs.every(function(r){return r.me===d})?d:'',ek:e.k};tab='log';render();scrollTo(0,0)}
function dkn(r){return r.me+(r.mn?'（'+r.mn+'）':'')}
function okn(r){return r.opp+(r.on?'（'+r.on+'）':'')}
function isRB(){return form.game==='符文戰場'}
var RBE=Object.keys(RBZ);
function rbList(k){var inp=document.getElementById('f_'+k),box=document.getElementById('rbl_'+k);if(!inp||!box)return;var q=(inp.value||'').trim().toLowerCase(),h='';RB.forEach(function(z,i){if(!q||z.toLowerCase().indexOf(q)>=0||RBE[i].toLowerCase().indexOf(q)>=0)h+='<div onclick="rbChoose(\''+k+'\','+i+')" style="padding:10px;border-bottom:1px solid var(--bd);cursor:pointer">'+esc(z)+'</div>'});box.innerHTML=h||'<div class="mu" style="padding:10px">沒有符合的牌組</div>';box.style.display='block'}
function rbChoose(k,i){var e=document.getElementById('f_'+k);if(e)e.value=RB[i];form[k]=RB[i];rbClose(k)}
function rbClose(k){var b=document.getElementById('rbl_'+k);if(b)b.style.display='none'}
if(document.addEventListener)document.addEventListener('click',function(ev){['me','opp'].forEach(function(k){var w=document.getElementById('rbw_'+k);if(w&&!w.contains(ev.target))rbClose(k)})});
function rbHtml(k,lab,ph){var nk=k==='me'?'mnote':'onote';return '<label>'+lab+'</label><div id="rbw_'+k+'" style="position:relative"><input id="f_'+k+'" autocomplete="off" placeholder="搜尋或選擇牌組" value="'+esc(form[k]||'')+'" oninput="rbList(\''+k+'\')" onfocus="rbList(\''+k+'\')"><div id="rbl_'+k+'" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:50;max-height:240px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)"></div></div><input id="f_'+nk+'" value="'+esc(form[nk]||'')+'" placeholder="'+ph+'" style="margin-top:6px">'}

var KEY='tcg_records_v1', mem=[], recs=load(), tab='add', fil='BO1';
var form={game:loadGame(),gamec:'',games:['','',''],date:today(),event:'',fmt:'BO1',me:'',opp:'',res:'W',score:'',turn:'',note:'',editId:null};
var GAMES=['符文戰場','Grand Archive','Battle Spirits'],gfil=(function(){try{return localStorage.getItem('tcg_stats_game_v1')||''}catch(e){return ''}})();
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):[]}catch(e){return mem}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(recs))}catch(e){mem=recs}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uniq(k){var o={};recs.forEach(function(r){if(r[k])o[r[k]]=1});return Object.keys(o)}
function opts(id,list){return '<datalist id="'+id+'">'+list.map(function(x){return '<option value="'+esc(x)+'">'}).join('')+'</datalist>'}
var RL={W:'勝',L:'敗',D:'和'};
function calcBo3(g){
  var a=g[0],b=g[1],c=g[2],w=0,l=0,g3=false;
  if(!a||!b)return{res:'',score:'',g3:false};
  [a,b].forEach(function(x){if(x==='W')w++;else if(x==='L')l++});
  if(w<2&&l<2){g3=true;if(!c)return{res:'',score:'',g3:true};if(c==='W')w++;else if(c==='L')l++}
  return{res:w>l?'W':l>w?'L':'D',score:w+'-'+l,g3:g3}}
function segG(i){var v=form.games[i];return '<div class="seg">'+[['W','勝','w'],['L','敗','l'],['D','和','d']].map(function(x){return '<button type="button" class="'+(v===x[0]?'on '+x[2]:'')+'" onclick="setG('+i+',\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div>'}
function setG(i,v){syncForm();form.games[i]=v;render()}
function resHtml(){
  if(form.fmt!=='BO3')return '<label>結果</label>'+seg('res',[['W','勝'],['L','敗'],['D','和']],form.res,{W:'w',L:'l',D:'d'});
  var c=calcBo3(form.games),h='';
  for(var i=0;i<(c.g3?3:2);i++)h+='<label>Game '+(i+1)+'</label>'+segG(i);
  return h+'<div style="margin-top:12px;padding:10px;border-radius:10px;background:var(--bg);text-align:center">整場結果　'+(c.res?'<span class="badge b-'+c.res.toLowerCase()+'">'+RL[c.res]+'</span> <b>'+c.score+'</b>':'<span class="mu">請依序填寫各局勝敗</span>')+'</div>'}
function seg(name,items,cur,cls){return '<div class="seg">'+items.map(function(it){return '<button type="button" class="'+(cur===it[0]?'on ':'')+(cls?cls[it[0]]||'':'')+'" onclick="setF(\''+name+'\',\''+it[0]+'\')">'+it[1]+'</button>'}).join('')+'</div>'}
function setF(k,v){syncForm();form[k]=v;if(k==='fmt'||k==='res')form.score='';render()}
function syncForm(){['date','event','me','opp','note','gamec'].forEach(function(k){var e=document.getElementById('f_'+k);if(e)form[k]=e.value})}
function add(){syncForm();
  var g=form.game==='__c'?form.gamec.trim():form.game;
  if(!g){alert('請選擇 TCG 分類');return}
  if(!form.event.trim()||!form.me.trim()||!form.opp.trim()){alert('請填寫賽事名稱、我的牌組與對手牌組');return}
  var rs=form.res,sc='',gm;
  if(form.fmt==='BO3'){var c=calcBo3(form.games);if(!c.res){alert('請填寫各局勝敗（Game 1、Game 2，必要時 Game 3）');return}rs=c.res;sc=c.score;gm=form.games.slice(0,c.g3?3:2)}
  var r={id:form.editId||Date.now(),game:g,date:form.date,event:form.event.trim(),fmt:form.fmt,me:form.me.trim(),opp:form.opp.trim(),res:rs,score:sc,games:gm,turn:form.turn,note:form.note.trim()};
  if(form.editId){recs=recs.map(function(x){return x.id===form.editId?r:x})}else recs.push(r);
  save();if(form.editId){form.game=loadGame()||g}else{saveGame(g);form.game=g}form.gamec='';form.opp='';form.score='';form.games=['','',''];form.note='';form.turn='';form.editId=null;tab='log';render()}
function del(id){if(!confirm('刪除這筆紀錄？'))return;recs=recs.filter(function(r){return r.id!==id});save();render()}
function startEdit(id){var r=recs.filter(function(x){return x.id===id})[0];if(!r)return;form={game:r.game||'',gamec:'',games:(r.games||[]).concat(['','','']).slice(0,3),date:r.date,event:r.event,fmt:r.fmt,me:r.me,opp:r.opp,res:r.res,score:r.score||'',turn:r.turn||'',note:r.note||'',editId:id};tab='add';render();scrollTo(0,0)}
function cancelEdit(){form={game:loadGame(),gamec:'',games:['','',''],date:today(),event:'',fmt:'BO1',me:'',opp:'',res:'W',score:'',turn:'',note:'',editId:null};tab='log';render()}
function loadGame(){try{return localStorage.getItem('tcg_last_game_v1')||''}catch(e){return ''}}

function clTok(){if(!CL.at)return Promise.reject(new Error('請先登入'));if(CL.exp-60>Date.now()/1000)return Promise.resolve(CL.at);return clFetch('/auth/v1/token?grant_type=refresh_token',{m:'POST',b:{refresh_token:CL.rt}}).then(function(r){if(!r.ok||!r.j||!r.j.access_token){CL={};clSave();render();throw new Error('登入已過期，請重新登入')}clSet(r.j);return CL.at})}
function clLogin(){var em=(document.getElementById('cl_em')||{}).value||'',pw=(document.getElementById('cl_pw')||{}).value||'';em=em.trim();if(!em||!pw){clMsg('請輸入信箱與密碼');return}clMsg('登入中…');clFetch('/auth/v1/token?grant_type=password',{m:'POST',b:{email:em,password:pw}}).then(function(r){if(!r.ok||!r.j||!r.j.access_token){clMsg(clErr(r.j,r.st));return}clSet(r.j);render()}).catch(function(){clMsg('無法連線，請檢查網路')})}
function clSignup(){var em=(document.getElementById('cl_em')||{}).value||'',pw=(document.getElementById('cl_pw')||{}).value||'';em=em.trim();if(!em||!pw){clMsg('請輸入信箱與密碼');return}if(pw.length<6){clMsg('密碼至少 6 個字元');return}clMsg('註冊中…');clFetch('/auth/v1/signup',{m:'POST',b:{email:em,password:pw}}).then(function(r){if(!r.ok){clMsg(clErr(r.j,r.st));return}if(r.j&&r.j.access_token){clSet(r.j);render()}else clMsg('註冊成功，請到信箱點擊驗證信後再登入')}).catch(function(){clMsg('無法連線，請檢查網路')})}
function clLogout(){var t=CL.at;CL={};clSave();if(t&&SB_URL)clFetch('/auth/v1/logout',{m:'POST',tok:t}).catch(function(){});render()}
function clGet(tok){return clFetch('/rest/v1/tcg_backup?select=data,updated_at&user_id=eq.'+CL.uid,{tok:tok}).then(function(r){if(!r.ok)throw new Error(clErr(r.j,r.st));return r.j&&r.j[0]||null})}
function clFmt(t){try{return new Date(t).toLocaleString()}catch(e){return t}}
function clUp(){clMsg('檢查雲端資料…');clTok().then(function(tok){return clGet(tok).then(function(row){var n=row&&row.data&&row.data.recs?row.data.recs.length:0;if(row&&!confirm('雲端目前有 '+n+' 筆（更新於 '+clFmt(row.updated_at)+'）。\n將用本機的 '+recs.length+' 筆覆蓋雲端，確定？')){clMsg('');return}var now=new Date().toISOString();return clFetch('/rest/v1/tcg_backup?on_conflict=user_id',{m:'POST',tok:tok,h:{Prefer:'resolution=merge-duplicates,return=minimal'},b:{user_id:CL.uid,data:{v:1,recs:recs,ev:EV,dm:DM},updated_at:now}}).then(function(r){if(!r.ok)throw new Error(clErr(r.j,r.st));CL.last=now;clSave();render();alert('已上傳 '+recs.length+' 筆到雲端')})})}).catch(function(e){clMsg(e&&e.message&&!/Failed to fetch|NetworkError|Load failed/i.test(e.message)?e.message:'無法連線，請檢查網路')})}
function clDown(){clMsg('讀取雲端資料…');clTok().then(function(tok){return clGet(tok).then(function(row){if(!row||!row.data||!Array.isArray(row.data.recs)){clMsg('雲端還沒有備份資料');return}var d=row.data;if(!confirm('雲端有 '+d.recs.length+' 筆（更新於 '+clFmt(row.updated_at)+'）。\n將用雲端資料覆蓋本機目前的 '+recs.length+' 筆，確定？')){clMsg('');return}recs=d.recs;save();EV=d.ev||{};sv(EVK,EV);DM=d.dm||{};sd();migRB();migEt();migEk();render();alert('已從雲端還原 '+d.recs.length+' 筆')})}).catch(function(e){clMsg(e&&e.message&&!/Failed to fetch|NetworkError|Load failed/i.test(e.message)?e.message:'無法連線，請檢查網路')})}
function cloudHtml(){var h='<div class="card"><b>雲端備份</b>';if(!SB_URL||!SB_KEY)return h+'<div class="mu" style="margin-top:6px">尚未設定雲端服務。</div></div>';if(CL.at){h+='<div class="mu" style="margin-top:6px">已登入：'+esc(CL.name||CL.email||'')+'</div>'+(CL.last?'<div class="mu">上次上傳：'+esc(clFmt(CL.last))+'</div>':'')+'<button class="btn" onclick="clUp()">上傳到雲端</button><button class="btn sec" onclick="clDown()">從雲端下載</button><button class="btn sec" onclick="clLogout()">登出</button>'}else{h+='<div class="mu" style="margin-top:6px">登入後可把資料備份到雲端，換手機也能還原。</div><label>信箱</label><input id="cl_em" type="email" autocomplete="username" placeholder="you@example.com"><label>密碼</label><input id="cl_pw" type="password" autocomplete="current-password" placeholder="密碼"><button class="btn" onclick="clLogin()">登入</button><button class="btn sec" onclick="clSignup()">註冊新帳號</button>'}return h+'<div class="mu" id="cl_msg" style="margin-top:8px"></div></div>'}
migRB();migEt();migEk();applySet();render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
</script>
